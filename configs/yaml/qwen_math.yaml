run:
  output_dir: results/raw
  evaluated_dir: results/evaluated
  summary_dir: results/summaries
  log_dir: results/logs
  num_workers: 2
  eval_num_workers: 4
  micro_batch_size: 1

vllm:
  tensor_parallel_size: 2
  gpu_memory_utilization: 0.9
  max_model_len: 4096

models:
  aliases:
    Qwen/Qwen2.5-Math-1.5B-Instruct: models/Qwen2.5-Math-1.5B-Instruct
  settings:
    Qwen/Qwen2.5-Math-1.5B-Instruct:
      reasoning_mode: prompt_cot
      enable_thinking:
      cannot_disable_thinking: false

datasets:
  - name: math500
    sample_path: data/processed/math500_sample.jsonl
    max_samples: 50
  - name: gsm8k
    sample_path: data/processed/gsm8k_sample.jsonl
    max_samples: 50
  - name: aime2024
    sample_path: data/processed/aime2024_sample.jsonl
    max_samples: 30

method_configs:
  cot_zero:
    temperature: 0.0
    top_p: 1.0
    max_tokens: 4096
  cot_few_shot:
    temperature: 0.0
    top_p: 1.0
    max_tokens: 4096
    num_examples: 3
  self_refine:
    temperature: 0.0
    top_p: 1.0
    max_tokens: 4096
    max_refine_rounds: 1
  self_consistency:
    temperature: 0.7
    top_p: 0.95
    max_tokens: 4096
    n_samples: 5
  tir:
    temperature: 0.0
    top_p: 1.0
    max_tokens: 8192

scoring:
  weights:
    answer: 0.3
    length: 0.4
    reflection: 0.3
  params:
    a_star: 2
    tau_a: 2.0
    r_star: 1
    tau_r: 2.0
    rho_star: 0.2
    tau_tail: 0.2
    L_ref: 200
    tau_d: 200.0
