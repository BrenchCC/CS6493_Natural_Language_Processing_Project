run:
  output_dir: results/raw
  evaluated_dir: results/evaluated
  summary_dir: results/summaries
  log_dir: results/logs
  num_workers: 2
  eval_num_workers: 8
  micro_batch_size: 1

vllm:
  tensor_parallel_size: 2
  gpu_memory_utilization: 0.9
  max_model_len: 32768

models:
  aliases:
    Qwen/Qwen2.5-Math-1.5B-Instruct: models/Qwen2.5-Math-1.5B-Instruct
  settings:
    Qwen/Qwen2.5-Math-1.5B-Instruct:
      reasoning_mode: prompt_cot
      enable_thinking:
      cannot_disable_thinking: false
      disable_sampling: false

datasets:
  - name: math500
    sample_path: data/processed/math500_sample.jsonl
    max_samples: 50
  - name: gsm8k
    sample_path: data/processed/gsm8k_sample.jsonl
    max_samples: 50
  - name: aime2024
    sample_path: data/processed/aime2024_sample.jsonl
    max_samples: 30

method_configs:
  cot_zero:
    temperature: 0.0
    top_p: 1.0
    max_tokens: 32768
  cot_few_shot:
    temperature: 0.0 
    top_p: 1.0
    max_tokens: 32768
    num_examples: 3
  plan_solve:
    temperature: 0.0
    top_p: 1.0
    max_tokens: 32768
    max_plan_steps: 5
  self_ask:
    temperature: 0.0
    top_p: 1.0
    max_tokens: 32768
    max_self_questions: 5
  self_refine:
    temperature: 0.0
    top_p: 1.0
    max_tokens: 32768
    max_refine_rounds: 1
  self_consistency:
    temperature: 0.7
    top_p: 0.95
    max_tokens: 32768
    n_samples: 5
  tir:
    temperature: 0.0
    top_p: 1.0
    max_tokens: 32768
    repetition_penalty: 1.2

scoring:
  reflection_patterns:
    - "\\bwait\\b"
    - "\\balternatively\\b"
    - "\\bhmm\\b"
    - "\\bbut\\b"
    - "\\bhowever\\b"
    - "\\balternative\\b"
    - "\\banother\\b"
    - "\\bcheck\\b"
    - "\\bdouble-check\\b"
    - "\\boh\\b"
    - "\\bmaybe\\b"
    - "\\bverify\\b"
    - "\\bother\\b"
    - "\\bagain\\b"
    - "\\bnow\\b"
    - "\\bah\\b"
    - "\\bany\\b"
    - "rethink"
    - "review"
    - "double-check"
    - "check again"
    - "let me verify"
    - "反思"
    - "检查"
  weights:
    answer: 0.5
    length: 0.3
    reflection: 0.2
  params:
    length_ref: 1024
    tau_length: 512.0
    answer_count_ref: 1
    tau_answer_count: 1.0
    tail_ratio_ref: 0.2
    tau_tail_ratio: 0.2
    reflection_count_ref: 1
    tau_reflection: 2.0
    correct_score_floor: 0.6
